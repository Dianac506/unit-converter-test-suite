
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter with Test Suite</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Unit Converter</h1>
        <p>Fast, simple and accurate unit conversions</p>
    </header>

    <main class="converter">

        <h2>Measurement Converter</h2>

        <label for="category">Conversion Category</label>
        <select id="category">
            <option value="length">Length</option>
            <option value="weight">Weight</option>
            <option value="temperature">Temperature</option>
            <option value="volume">Volume</option>
            <option value="time">Time</option>
        </select>

        <label for="amount">Enter Value</label>
        <input type="number" id="amount" value="1" step="any">

        <div class="unit-row">
            <div>
                <label for="from">From</label>
                <select id="from"></select>
            </div>

            <div>
                <label for="to">To</label>
                <select id="to"></select>
            </div>
        </div>

        <section class="result" aria-live="polite">
            <h3>Conversion Result</h3>
            <output id="result">--</output>
        </section>

        <p id="error" role="alert"></p>

    </main>

    <footer>
        <p>Developed by Diana Carolina Salgado Ortiz</p>
        <p>Bay Atlantic University</p>
        <p>CMPS 570 - Software Architecture</p>
        <p>Quality Attribute: Testability</p>
    </footer>

    <script type="module" src="app.js"></script>

</body>
</html>
